---
# Keep the pierun laptop awake and serving 24/7: lid closed, on AC, k3s up.

- name: Ensure logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ignore lid switch and idle (logind drop-in)
  ansible.builtin.copy:
    src: laptop-server.conf
    dest: /etc/systemd/logind.conf.d/laptop-server.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload logind

- name: Mask all sleep-related systemd targets
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target

- name: Install iw (wireless CLI, needed for power-save control)
  # builtin.package auto-detects pacman on Arch — no community.general
  # collection dependency on the control node.
  ansible.builtin.package:
    name: iw
    state: present

- name: Disable Wi-Fi power save on hotplug (udev rule)
  ansible.builtin.copy:
    src: 81-wifi-powersave.rules
    dest: /etc/udev/rules.d/81-wifi-powersave.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev rules

- name: Read current Wi-Fi power save state
  ansible.builtin.command: iw dev wlan0 get power_save
  register: host_24_7_wifi_power_save
  changed_when: false
  # a pure read — run it even in --check so the next task's condition works
  check_mode: false

- name: Disable Wi-Fi power save now
  ansible.builtin.command: iw dev wlan0 set power_save off
  when: "': on' in host_24_7_wifi_power_save.stdout"
  changed_when: true

- name: Check whether the k3s kubeconfig exists yet
  ansible.builtin.stat:
    path: /etc/rancher/k3s/k3s.yaml
  register: host_24_7_k3s_kubeconfig

- name: Ensure ~/.kube exists for kacper
  ansible.builtin.file:
    path: /home/kacper/.kube
    state: directory
    owner: kacper
    group: kacper
    mode: "0700"

- name: Copy k3s kubeconfig for kacper
  # guarded so the play also runs clean on a fresh host before k3s install
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/kacper/.kube/config
    remote_src: true
    owner: kacper
    group: kacper
    mode: "0600"
  when: host_24_7_k3s_kubeconfig.stat.exists

- name: Install arch-audit (CVE report source for the dashboard)
  ansible.builtin.package:
    name: arch-audit
    state: present

- name: Install arch-audit report service
  ansible.builtin.copy:
    src: arch-audit-report.service
    dest: /etc/systemd/system/arch-audit-report.service
    owner: root
    group: root
    mode: "0644"
  register: host_24_7_audit_service

- name: Install arch-audit report timer
  ansible.builtin.copy:
    src: arch-audit-report.timer
    dest: /etc/systemd/system/arch-audit-report.timer
    owner: root
    group: root
    mode: "0644"
  register: host_24_7_audit_timer

# Migration from the first (DynamicUser=yes) revision of the unit: it left
# /var/lib/arch-audit as a symlink into /var/lib/private (0700 root) —
# unreadable for non-root and wrong for the pod's hostPath. Remove both; the
# User=nobody unit recreates a real, world-readable directory on next run.
- name: Check whether /var/lib/arch-audit is a DynamicUser-era symlink
  ansible.builtin.stat:
    path: /var/lib/arch-audit
    follow: false
  register: host_24_7_audit_dir

- name: Remove DynamicUser-era symlink
  ansible.builtin.file:
    path: /var/lib/arch-audit
    state: absent
  when: host_24_7_audit_dir.stat.islnk | default(false)

- name: Remove DynamicUser-era private state directory
  ansible.builtin.file:
    path: /var/lib/private/arch-audit
    state: absent
  when: host_24_7_audit_dir.stat.islnk | default(false)

- name: Enable arch-audit report timer
  ansible.builtin.systemd_service:
    name: arch-audit-report.timer
    enabled: true
    state: started
    daemon_reload: "{{ host_24_7_audit_service.changed or host_24_7_audit_timer.changed }}"

- name: Check whether an arch-audit report exists yet
  ansible.builtin.stat:
    path: /var/lib/arch-audit/report.json
  register: host_24_7_audit_report

- name: Run arch-audit report once so the Glance hostPath mount has a file
  # The dashboard Deployment hostPath-mounts /var/lib/arch-audit with
  # type: Directory — this play must run before Glance can schedule.
  ansible.builtin.systemd_service:
    name: arch-audit-report.service
    state: started
  when: not host_24_7_audit_report.stat.exists
