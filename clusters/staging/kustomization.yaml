# Explicit root kustomization for the Flux bootstrap path ./clusters/staging.
# Without this file kustomize-controller auto-generates an equivalent one, but
# then ANY stray .yaml dropped at this level changes what gets applied — and
# one undecodable file hard-errors the WHOLE Kustomization, flux-system
# included. Explicit inclusion = a stray file cannot change cluster state.
# This layer contains ONLY the Flux bootstrap and the two Kustomization CRs;
# actual workloads live under ./infrastructure and ./apps/staging and are
# reconciled by those CRs, not by this file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - infrastructure.yaml
  - apps.yaml
