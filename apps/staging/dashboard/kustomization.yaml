apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - networkpolicy.yaml
  # Deployment and its Secret are an atomic pair (same rule as cloudflared in
  # monitoring): removing either one alone leaves the apps Kustomization
  # (wait: true) red on a CreateContainerConfigError pod.
  - glance.yaml
  - glance-secrets.sops.yaml

# glance.yml IS the dashboard — edit it, commit, done. The hash suffix on the
# generated ConfigMap rolls the pod on every change; Glance's built-in config
# auto-reload does NOT survive ConfigMap symlink swaps, never rely on it.
configMapGenerator:
  - name: glance-config
    namespace: dashboard
    files:
      - glance.yml
