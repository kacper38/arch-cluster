apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  # Glance itself (glance.yaml + glance-secrets.sops.yaml + networkpolicy.yaml
  # + the glance-config configMapGenerator) arrives in the next commit as an
  # atomic set — Deployment and the Secret it references always ship together,
  # or the apps Kustomization (wait: true) goes red on
  # CreateContainerConfigError. Namespace + RBAC land first only because the
  # SA must exist before its token can be minted.
