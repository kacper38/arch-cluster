apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: dashboard
  labels:
    app.kubernetes.io/name: glance
    app.kubernetes.io/part-of: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glance
        app.kubernetes.io/part-of: dashboard
    spec:
      # The Flux-reader token arrives as an env var from glance-secrets (1-year
      # minted token, SOPS in git) — the pod deliberately does NOT mount its SA.
      automountServiceAccountToken: false
      containers:
        - name: glance
          # Tag + multi-arch digest sha256:32ab73d8... verified on Docker Hub
          # 2026-08-12. Docker Hub is the ONLY registry (no ghcr mirror).
          # Project releases slowly (~1/year) — check when bumping anything else.
          image: glanceapp/glance:v0.8.5
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            # FLUX_SA_TOKEN + PIHOLE_PASSWORD — referenced as ${VAR} in
            # glance.yml. A var missing here = Glance refuses to start
            # (CrashLoop with a clear "environment variable not found" log).
            - secretRef:
                name: glance-secrets
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            # arch-audit CVE report, written daily by the host timer
            # (ansible/roles/host_24_7). Served by Glance at /assets/.
            - name: arch-audit
              mountPath: /app/assets
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            # Image ships NO USER directive (would run as root) — the explicit
            # numeric UID is what makes runAsNonRoot satisfiable; do not
            # remove (same CreateContainerConfigError trap as cloudflared).
            # Glance is fully stateless (zero filesystem writes at v0.8.5),
            # so the read-only rootfs costs nothing.
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            # Generated by kustomization.yaml (configMapGenerator) from
            # glance.yml — hash-suffixed, so every config change rolls the pod.
            name: glance-config
        - name: arch-audit
          hostPath:
            # type Directory (not DirectoryOrCreate) on purpose: the Ansible
            # play creates and owns this path; a Pending pod here means the
            # play never ran on pierun — fix the host, don't let kubelet
            # create a root-owned stub. Single-node cluster, no nodeSelector
            # needed; add one if a second node ever appears.
            path: /var/lib/arch-audit
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: glance
  namespace: dashboard
  labels:
    app.kubernetes.io/name: glance
    app.kubernetes.io/part-of: dashboard
spec:
  selector:
    app.kubernetes.io/name: glance
  ports:
    - port: 8080
      targetPort: http
      name: http
