# Glance dashboard config — git IS the config store (ConfigMap via
# configMapGenerator; the hash suffix rolls the pod on every change, because
# Glance's own file-watcher does NOT survive ConfigMap symlink swaps).
# Secrets never live here — only $-brace env var references resolved by
# Glance at startup from the glance-secrets Secret (a missing var is a hard
# startup error, visible in pod logs). NOTE: interpolation runs on the RAW
# file, comments included — never write a literal dollar-brace var name in a
# comment (caught by config:validate 2026-08-14).
server:
  # Behind cloudflared — trust X-Forwarded-* from the tunnel.
  proxied: true
  # Served at /assets/ — the arch-audit hostPath mount, see glance.yaml.
  assets-path: /app/assets

pages:
  - name: Control plane
    columns:
      - size: small
        widgets:
          - type: monitor
            title: Services
            cache: 1m
            sites:
              - title: kacperhomelab.org
                url: https://kacperhomelab.org
                check-url: https://kacperhomelab.org/api/health
              - title: Uptime Kuma
                # Click-through goes via the tunnel; the check stays in-cluster.
                url: https://status.kacperhomelab.org
                check-url: http://uptime-kuma.monitoring.svc.cluster.local:3001
              - title: Pi-hole
                # /admin/ answers 302 → check the login page directly.
                url: http://192.168.178.53/admin
                check-url: http://192.168.178.53/admin/login

          - type: dns-stats
            service: pihole-v6
            url: http://192.168.178.53
            password: ${PIHOLE_PASSWORD}

          # Per-monitor board from Kuma's public status-page endpoints (slug
          # `home`, created programmatically — see README). Template adapted
          # from glanceapp/community-widgets widgets/uptime-kuma, pinned here
          # because that repo reorganizes paths; fetch stays in-cluster,
          # click-through links go via the tunnel.
          - type: custom-api
            title: Uptime Kuma
            title-url: https://status.kacperhomelab.org
            url: http://uptime-kuma.monitoring.svc.cluster.local:3001/api/status-page/home
            subrequests:
              heartbeats:
                url: http://uptime-kuma.monitoring.svc.cluster.local:3001/api/status-page/heartbeat/home
            cache: 2m
            template: |
              {{ $hb := .Subrequest "heartbeats" }}
              {{ if not (.JSON.Exists "publicGroupList") }}
              <p class="color-negative">Error reading response</p>
              {{ else if eq (len (.JSON.Array "publicGroupList")) 0 }}
              <p>No monitors found</p>
              {{ else }}
              <ul class="dynamic-columns list-gap-8">
                {{ range .JSON.Array "publicGroupList" }}
                {{ range .Array "monitorList" }}
                {{ $id := .String "id" }}
                {{ $hbArray := $hb.JSON.Array (print "heartbeatList." $id) }}
                <div class="flex items-center gap-12">
                  <a class="size-title-dynamic color-highlight text-truncate block grow" href="https://status.kacperhomelab.org/dashboard/{{ $id }}"
                    target="_blank" rel="noreferrer">
                    {{ .String "name" }} </a>
                  {{ if gt (len $hbArray) 0 }}
                    {{ $latest := index $hbArray (sub (len $hbArray) 1) }}
                    {{ if eq ($latest.Int "status") 1 }}
                    <div>{{ $latest.Int "ping" }}ms</div>
                    <div class="monitor-site-status-icon-compact" title="OK">
                      <svg fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                          d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z"
                          clip-rule="evenodd"></path>
                      </svg>
                    </div>
                    {{ else }}
                    <div><span class="color-negative">DOWN</span></div>
                    <div class="monitor-site-status-icon-compact" title="{{ if $latest.Exists "msg" }}{{ $latest.String "msg" }}{{ else }}Error{{ end }}">
                      <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                          d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
                          clip-rule="evenodd"></path>
                      </svg>
                    </div>
                    {{ end }}
                  {{ else }}
                    <div><span class="color-negative">No data</span></div>
                    <div class="monitor-site-status-icon-compact" title="No data available">
                      <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <path d="M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm0-2a6 6 0 1 0 0-12 6 6 0 0 0 0 12zm-.75-8a.75.75 0 0 1 1.5 0v3a.75.75 0 0 1-1.5 0V8zm.75 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                      </svg>
                    </div>
                  {{ end }}
                </div>
                {{ end }}
                {{ end }}
              </ul>
              {{ end }}

      - size: full
        widgets:
          - type: custom-api
            title: Flux
            # Token: 1-year SA token (dashboard/glance), SOPS-shipped —
            # re-mint yearly, see README failure modes. allow-insecure: Glance
            # has no custom-CA option (checked v0.8.5) and this hop never
            # leaves the node.
            url: https://kubernetes.default.svc/apis/kustomize.toolkit.fluxcd.io/v1/kustomizations?limit=50
            headers:
              Authorization: Bearer ${FLUX_SA_TOKEN}
              Accept: application/json
            allow-insecure: true
            cache: 2m
            template: |
              <ul class="list list-gap-10">
                {{ range .JSON.Array "items" }}
                  {{ $ready := "Unknown" }}
                  {{ range .Array "status.conditions" }}
                    {{ if eq (.String "type") "Ready" }}{{ $ready = .String "status" }}{{ end }}
                  {{ end }}
                  <li class="flex justify-between items-center">
                    <div>
                      <div class="color-highlight">{{ .String "metadata.name" }}</div>
                      <div class="size-h6 color-subdue">{{ .String "status.lastAppliedRevision" }}</div>
                    </div>
                    {{ if eq $ready "True" }}
                      <div class="color-positive">ready</div>
                    {{ else }}
                      <div class="color-negative">NOT READY</div>
                    {{ end }}
                  </li>
                {{ end }}
              </ul>

          - type: custom-api
            title: CVEs — arch-audit (pierun)
            # Served by Glance itself from the read-only hostPath mount
            # (/var/lib/arch-audit, written daily by the Ansible-managed
            # arch-audit-report.timer). Loopback — no NetworkPolicy involved.
            url: http://localhost:8080/assets/report.json
            cache: 1h
            # Template API notes (docs/custom-api.md @ v0.8.5): root array =
            # .JSON.Array "" (empty key); no `join` helper exists — string
            # arrays are rendered by ranging with .String "".
            template: |
              {{ $vulns := .JSON.Array "" }}
              <div class="size-h6 color-subdue margin-bottom-10">
                {{ $vulns | len }} open advisories — fixable ones first
              </div>
              <ul class="list list-gap-10">
                {{ range $vulns }}
                  {{ if ne (.String "fixed") "" }}
                    <li class="flex justify-between items-center">
                      <div>
                        <div class="color-highlight">{{ range .Array "packages" }}{{ .String "" }} {{ end }}</div>
                        <div class="size-h6 color-subdue">{{ .String "name" }} · {{ len (.Array "issues") }} CVEs</div>
                      </div>
                      <div class="color-negative">fix: {{ .String "fixed" }}</div>
                    </li>
                  {{ end }}
                {{ end }}
                {{ range $vulns }}
                  {{ if eq (.String "fixed") "" }}
                    <li class="flex justify-between items-center">
                      <div>
                        <div>{{ range .Array "packages" }}{{ .String "" }} {{ end }}</div>
                        <div class="size-h6 color-subdue">{{ .String "name" }} · {{ len (.Array "issues") }} CVEs · severity {{ .String "severity" }}</div>
                      </div>
                      <div class="color-subdue">no fix yet</div>
                    </li>
                  {{ end }}
                {{ end }}
              </ul>

          - type: hacker-news
            limit: 15
            collapse-after: 5

      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: Homelab
                links:
                  - title: Uptime Kuma
                    url: https://status.kacperhomelab.org
                  - title: kacperhomelab.org
                    url: https://kacperhomelab.org
                  - title: Pi-hole admin
                    # LAN address — resolves only from home network.
                    url: http://192.168.178.53/admin
              - title: Ops
                links:
                  - title: arch-cluster repo
                    url: https://github.com/kacper38/arch-cluster
                  - title: CI runs
                    url: https://github.com/kacper38/arch-cluster/actions
                  - title: Cloudflare Zero Trust
                    url: https://one.dash.cloudflare.com/

          # Placeholder feed set — edit freely; a change here rolls the pod
          # via the ConfigMap hash, no restart needed by hand.
          - type: rss
            title: News
            style: vertical-list
            limit: 20
            collapse-after: 8
            feeds:
              - url: https://archlinux.org/feeds/news/
                title: Arch Linux
              - url: https://kubernetes.io/feed.xml
                title: Kubernetes blog
              - url: https://lobste.rs/rss
                title: Lobsters
